version: 2
updates:
  # Actions are pinned by commit SHA; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore

  # dmgbuild and its dependencies, pinned by hash in scripts/dmg/requirements.txt.
  - package-ecosystem: pip
    directory: /scripts/dmg
    schedule:
      interval: monthly
    groups:
      dmgbuild:
        patterns: ['*']
    commit-message:
      prefix: chore

  # ruff and clang-format, pinned by hash in scripts/lint/requirements.txt. A new version can
  # format differently; the lint step in CI shows the diff on the update's pull request.
  - package-ecosystem: pip
    directory: /scripts/lint
    schedule:
      interval: monthly
    groups:
      lint:
        patterns: ['*']
    commit-message:
      prefix: chore
