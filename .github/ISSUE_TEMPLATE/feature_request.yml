name: Feature request
description: Something Xattot should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
