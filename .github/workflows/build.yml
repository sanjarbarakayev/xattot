name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Test layout and app logic
        run: make test

      - name: Build app and DMG
        run: make dmg

      - name: Check the app has no networking code
        run: ./scripts/check_no_network.sh

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 Xattot.dmg | tee Xattot.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Xattot
          path: |
            dist/Xattot.dmg*
            dist/Xattot-layout.zip

      # Ties the released DMG to this commit and workflow run; verify with `gh attestation verify`.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Xattot.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Xattot.dmg dist/Xattot.dmg.sha256 dist/Xattot-layout.zip \
            --title "Xattot $GITHUB_REF_NAME" \
            --notes "$(printf 'Built by GitHub Actions from %s.\n\n- Xattot.dmg SHA-256: `%s`\n' "$GITHUB_SHA" "$(cut -d' ' -f1 dist/Xattot.dmg.sha256)")"

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show which kbd.h the build uses
        shell: pwsh
        run: Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter kbd.h | Select-Object -ExpandProperty FullName

      - name: Build layout DLLs and installer
        shell: cmd
        run: windows\build.bat

      - name: Checksum
        shell: pwsh
        working-directory: dist
        # LF, not the CRLF Tee-Object writes, so `shasum -c` on macOS and Linux reads the file name.
        run: |
          $line = (Get-FileHash Xattot-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  Xattot-Setup.exe'
          [IO.File]::WriteAllText("$PWD\Xattot-Setup.exe.sha256", "$line`n")
          $line

      - uses: actions/upload-artifact@v4
        with:
          name: Xattot-Windows
          path: dist/Xattot-Setup.exe*

  windows-test:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: Xattot-Windows
          path: artifact

      - name: Install
        shell: powershell
        run: windows\tests\setup.ps1 -Installer artifact\Xattot-Setup.exe

      - name: Check what the installer registered
        id: installed
        shell: powershell
        run: |
          $klid = windows\tests\check.ps1 -Installed
          Add-Content -Path $env:GITHUB_OUTPUT -Value "klid=$klid" -Encoding utf8

      - name: Type every key through ToUnicodeEx
        shell: cmd
        run: |
          python build_windows.py || exit /b 1
          windows\tests\run.bat ${{ steps.installed.outputs.klid }}

      # The layout is loaded now, so this upgrade has to move the DLLs it replaces aside.
      - name: Install again over the loaded layout
        shell: powershell
        run: |
          windows\tests\setup.ps1 -Installer artifact\Xattot-Setup.exe
          $klid = windows\tests\check.ps1 -Installed
          if ($klid -ne '${{ steps.installed.outputs.klid }}') { throw "reinstall registered $klid" }

      - name: Type again after the upgrade
        shell: cmd
        run: windows\tests\run.bat ${{ steps.installed.outputs.klid }}

      - name: Uninstall
        shell: powershell
        run: |
          windows\tests\setup.ps1 -Uninstall
          windows\tests\check.ps1 -Removed

  windows-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Xattot-Windows
          path: dist

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Xattot-Setup.exe

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/Xattot-Setup.exe dist/Xattot-Setup.exe.sha256 --repo "$GITHUB_REPOSITORY"
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body --repo "$GITHUB_REPOSITORY")
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf '%s\n- Xattot-Setup.exe SHA-256: `%s`\n' "$notes" "$(cut -d' ' -f1 dist/Xattot-Setup.exe.sha256)")"
